name: CI

# روی هر PR و هر push به main: کنترل نوع (TypeScript) بک‌اند و فرانت‌اند، build فرانت‌اند، و اجرای «همه‌ی migrationها از صفر»
# روی یک PostgreSQL تازه (همان نسخه‌ی تولید) + seed، تا migration خراب یا drift قبل از مستقر شدن دیده شود.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_ci?schema=public
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: Apply all migrations from scratch
        run: npx prisma migrate deploy
      - name: Schema matches migrations (no drift)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        continue-on-error: true # partial unique index های raw-SQL را Prisma نمی‌شناسد؛ فقط گزارش می‌شود
      - name: Seed
        run: npx tsx prisma/seed.ts

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  release-consistency:
    name: Version files agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/release.mjs --check

  docker-build:
    name: Release images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend release image
        run: docker build -f backend/Dockerfile.release -t erp-backend:ci backend
      - name: Frontend release image
        run: docker build -f frontend/Dockerfile.release -t erp-frontend:ci frontend
