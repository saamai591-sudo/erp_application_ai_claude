server {
    listen 5173;
    server_name _;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # فایل‌های build با هش در نام (ثابت و قابل کش طولانی)
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store, no-cache, must-revalidate, private"; add_header Pragma "no-cache"; }
    location = /config.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store, no-cache, must-revalidate, private"; add_header Pragma "no-cache"; }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }
}
