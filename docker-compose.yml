services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: accounting_erp
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d accounting_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://erp:erp_password@db:5432/accounting_erp?schema=public
      JWT_SECRET: change_this_secret_in_production
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    environment:
      # عمداً تنظیم نشده: frontend/src/lib/api.ts در نبود این متغیر، آدرس بک‌اند را از روی
      # window.location.hostname مرورگر می‌سازد تا هم از localhost و هم از IP سرور در شبکه کار کند.
      CI: "true"
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
