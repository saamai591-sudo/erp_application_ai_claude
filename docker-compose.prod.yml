# اجرای این برنامه روی یک سرور، از روی ایمیج‌های آماده در reg.greenbits.ir (بدون نیاز به سورس‌کد روی سرور —
# کد داخل خودِ ایمیج‌ها کپی شده). قبل از اجرا:
#   1) docker login reg.greenbits.ir   (اگر سرور قبلاً لاگین نکرده)
#   2) کنار همین فایل یک .env بسازید (نمونه در .env.example) و مقادیر را با رشته‌های تصادفی قوی پر کنید
#   3) docker compose -f docker-compose.prod.yml up -d
# بعد از بالا آمدن: رمز پیش‌فرض ادمین (seed) را حتماً از داخل برنامه تغییر دهید.

services:
  db:
    # روی سرورهایی که به Docker Hub دسترسی ندارند (مثلاً داخل ایران) DB_IMAGE را روی ایمیج postgres:16-alpine داخل ریجستری خودتان بگذارید (.env.example)
    image: ${DB_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در فایل .env تنظیم کنید}
      POSTGRES_DB: accounting_erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d accounting_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # دیتابیس عمداً به بیرون از شبکه‌ی Docker باز نیست؛ فقط backend به آن دسترسی دارد.
    # برای دسترسی موقت با pgAdmin از همین سرور، خط زیر را از کامنت خارج کنید (فقط روی 127.0.0.1، نه 0.0.0.0):
    # ports:
    #   - "127.0.0.1:5433:5432"

  backend:
    image: reg.greenbits.ir/accounting-erp-backend:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/accounting_erp?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET را در فایل .env تنظیم کنید}
      # کلید رمزنگاری کلید خصوصی «حافظه مالیاتی»؛ خالی ⇒ از JWT_SECRET مشتق می‌شود. برای عوض‌کردن JWT_SECRET بدون از دست دادن کلید، اینجا مقدار «قدیمیِ» JWT_SECRET را بگذارید
      TAX_KEY_ENCRYPTION_SECRET: ${TAX_KEY_ENCRYPTION_SECRET:-}
      PORT: 4000
      # حالت production (جزئیات خطا هرگز به کلاینت نمی‌رود؛ فقط لاگ سرور)
      NODE_ENV: production
      # (اختیاری) مبدأهای مجاز CORS وقتی frontend روی hostname دیگری از API باز می‌شود (جداشده با کاما)؛ خالی = فقط هم‌hostname و هم‌مبدأ
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # ارسال صورتحساب به سامانه مودیان — پیش‌فرض خاموش (ارسال واقعی قانونی است). نگاه کنید به .env.example
      TAX_TRANSPORT_ENABLED: ${TAX_TRANSPORT_ENABLED:-false}
      TAX_API_BASE_URL: ${TAX_API_BASE_URL:-https://tp.tax.gov.ir/req/api/}
      TAX_API_INSECURE_TLS: ${TAX_API_INSECURE_TLS:-false}
      # زمان‌بند «کارهای زمان‌بندی‌شده» — پیش‌فرض خاموش؛ فقط روی محیطی که باید خودکار کار کند true شود. نگاه کنید به .env.example
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    volumes:
      # پشتیبان‌های خودکار (سیاست از صفحه‌ی /management)؛ volume جدا تا با ساخت دوباره‌ی کانتینر پاک نشوند
      - backups:/backups
    ports:
      - "4000:4000"

  frontend:
    image: reg.greenbits.ir/accounting-erp-frontend:latest
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    environment:
      # ایمیج frontend یک nginx ثابت (خروجی build) است؛ آدرس API هنگام بالا آمدن کانتینر در config.js نوشته می‌شود.
      # در نبود این متغیر، آدرس بک‌اند از روی hostname مرورگر ساخته می‌شود (http://<همان آدرسی که فرانت‌اند رویش باز شده>:4000/api).
      # پشت پراکسی با یک دامنه (HTTPS) /api بگذارید و پراکسی مسیر /api را به backend:4000 بفرستد؛ خالی = http://<hostname>:4000/api
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:5173"

volumes:
  db_data:
  backups:
